name: Build unsigned IPA

# Builds an unsigned OpenParsec.ipa with the newest Xcode (iOS 27 SDK) on a GitHub macOS runner.
# Run it from the Actions tab ("Run workflow"), or push a tag like v2.1.0 to also attach the
# .ipa to that tag's GitHub release.

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: Xcode version (latest-stable, or e.g. 27.0 / 26.2)
        required: false
        default: latest-stable
      runner:
        description: macOS runner image
        required: false
        default: macos-26
      configuration:
        description: Build configuration
        type: choice
        options:
          - Release
          - Debug
        default: Release
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode || 'latest-stable' }}

      - name: Build
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenParsec-unsigned-ipa
          path: build/OpenParsec-unsigned.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Unsigned build, sign it with your sideloading tool of choice."
          gh release upload "$TAG" build/OpenParsec-unsigned.ipa --clobber
